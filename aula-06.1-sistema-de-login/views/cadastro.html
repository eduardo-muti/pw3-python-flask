{% extends 'base.html' %}

{% block content %}

{% with messages = get_flashed_messages(with_categories=true) %}

{% for category, message in messages %}
  <div class="alert alert-{{ category }}">
    {{message}}
  </div>
  {% endfor %}
  {% endwith %}

<div class="container">
  <div class="card mt-4" >
    <div class="card-header">
        <h2>Cadastro usuario</h2>

    </div>
    <div class="card-body">
        <form action="{{url_for('cadastro')}}" method="POST">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="insira seu email" class="form-control">
            <label>Senha</label>
            <input type="password" name="senha" placeholder="insira sua senha" class="form-control">
            <button type="submit" class="btn btn-outline-danger
            btn-block">Cadastrar</button>

        </form>
    </div>
   </div>    
</div>











{% endblock content %}
