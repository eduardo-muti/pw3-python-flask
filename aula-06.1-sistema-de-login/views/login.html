{% extends 'base.html' %}

{% block content %}
<div class="container col-4">
    <div class="card mt-4">
        <div class="card-header">
            <h1>Login do usuário</h1>
        </div>
        <div class="card-body m-auto">
                <form action="{{url_for('login')}}" method="POST">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="insira seu email" required class="form-control">
            <label>Senha</label>
            <input type="password" name="senha" placeholder="insira sua senha" required class="form-control">
            <button type="submit" class="btn btn-outline-danger
            btn-block">Entrar</button>

            </form>
            <hr>
            <h6>não possui conta <a href="{{url_for('cadastro')}}">Cadastre-se</a> </h6>
        </div>

    </div>

</div>

{% endblock content %}
